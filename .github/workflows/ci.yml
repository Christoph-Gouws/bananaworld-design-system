# @bananaworld/design-system — PR Check Suite (COMP-04, library slice)
# A pure TypeScript-source library (no build step — consumers transpile it via Next.js
# transpilePackages). Baseline jobs may be ADDED to but never removed or weakened
# (kernel rule, COMP-04 of _kernel/governance/UNIVERSAL_COMPLIANCE_BASELINE.md).
# Branch protection (repo level) requires this workflow green before merge.
#
# Follow-ups (not blocking COMP-03/04): the repo's own `format:check` currently fails on
# pre-existing style drift (run `prettier --write` once to adopt it), and a dedicated test
# suite for the shared ./pricing engine (currently exercised only by DC/CRM downstream).

name: PR Check Suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only High/Critical block CI; Moderate is tracked, not blocking.
      - run: pnpm audit --prod --audit-level=high

  sast:
    name: SAST — Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/react
            p/security-audit

  secret-scan:
    name: Secret Scanner — Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
