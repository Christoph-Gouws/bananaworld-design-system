# @bananaworld/design-system — Secret Scanner (nightly + on-demand)
# COMP-03 (secret scanning): full-history sweep beyond the per-PR diff.

name: Secret Scanner — Nightly + On-Demand

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks-full-history:
    name: Gitleaks — Full Repository History
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: results.sarif
          retention-days: 30
